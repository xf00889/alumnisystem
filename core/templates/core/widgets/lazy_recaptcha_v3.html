{% load static %}
<input
    type="hidden"
    name="{{ widget.name }}"
    data-recaptcha-action="{{ action|default:'submit' }}"
    {% for name, value in widget.attrs.items %}{% if value is not False %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}
>
<script src="{% static 'js/lazy-recaptcha-v3.js' %}" defer></script>
