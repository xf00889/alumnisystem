{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>document.documentElement.classList.add("fe-page--maintenance-html");</script>
<link rel="stylesheet" href="{% static 'css/modules/system.css' %}">
</head>
<body>
    <section class="card" role="status" aria-live="polite">
        <div class="content">
            <div class="brand-row">
                <img class="logo-norsu" src="{% static 'images/logo_norsu.png' %}" alt="NORSU Logo">
                <img class="logo-alumni" src="{% static 'images/alumni_logo.png' %}" alt="NORSU Alumni Logo">
            </div>
            <div class="status-chip">
                <span class="dot" aria-hidden="true"></span>
                Scheduled Maintenance
            </div>
            <h1>We&rsquo;ll Be Back Shortly</h1>
            <p class="subtitle">{{ maintenance_message }}</p>
            <div class="meta">
                <span class="meta-badge">NORSU Alumni System</span>
                <span class="meta-badge">HTTP 503</span>
            </div>
        </div>
    </section>
</body>
</html>
