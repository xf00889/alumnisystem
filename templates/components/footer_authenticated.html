{% comment %}Compact legal-only footer for authenticated experiences.{% endcomment %}
<footer class="authenticated-footer" aria-label="NORSU Alumni footer">
    <div class="authenticated-footer-inner">
        <p class="authenticated-footer-credit">&copy; {% now "Y" %} NORSU Alumni Network <span aria-hidden="true">&middot;</span> Negros Oriental State University &mdash; Office of Alumni Affairs</p>
        {% if legal_pages %}
        <nav class="authenticated-footer-legal" aria-label="Legal pages">
            {% for page in legal_pages %}<a href="{{ page.get_absolute_url }}">{{ page.title }}</a>{% endfor %}
        </nav>
        {% endif %}
    </div>
</footer>
