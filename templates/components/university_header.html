{% load static %}

<header class="university-header" aria-label="University identity">
    <div class="header-content">
        <div class="header-left">
            <a class="header-logo-link" href="{% url 'core:home' %}" aria-label="Go to the NORSU Alumni homepage">
                <img src="{% static 'images/logo_norsu.webp' %}" alt="Negros Oriental State University seal" class="norsu-logo" width="52" height="52" decoding="async">
                <span class="header-logo-divider" aria-hidden="true"></span>
                <img src="{% static 'images/alumni_logo.webp' %}" alt="NORSU Alumni logo" class="alumni-logo" width="45" height="43" decoding="async">
            </a>
        </div>

        <div class="header-center">
            <p class="university-kicker">Established 1907 · Negros Oriental</p>
            <p class="university-name">Negros Oriental State University</p>
            <p class="office-subtitle">Office of Alumni Affairs</p>
        </div>
    </div>
</header>
