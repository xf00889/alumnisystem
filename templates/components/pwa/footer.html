{% load static %}
<button type="button" class="norsu-pwa-install-fab" data-pwa-install hidden aria-label="Install NORSU Alumni Network"><span aria-hidden="true">&#8681;</span> Install NORSU Alumni app</button>
<div class="norsu-pwa-help" id="norsuPwaHelp" role="dialog" aria-modal="true" aria-labelledby="norsuPwaHelpTitle" hidden>
  <div class="norsu-pwa-help__backdrop" data-pwa-close></div>
  <div class="norsu-pwa-help__panel" tabindex="-1">
    <h2 id="norsuPwaHelpTitle">Install NORSU Alumni</h2>
    <p id="norsuPwaHelpInstructions">Open your browser menu and choose Install app or Add to Home Screen, when offered.</p>
    <button type="button" data-pwa-close>Got it</button>
  </div>
</div>
<script src="{% static 'pwa/install.js' %}" defer></script>
