<aside class="public-tracer-banner public-tracer-banner--{{ banner_variant|default:'fixed' }} no-print"
       aria-label="Tracer study announcement">
    <div class="public-tracer-banner__inner">
        <div class="public-tracer-banner__content">
            <span class="public-tracer-banner__icon" aria-hidden="true">
                <i class="fas fa-clipboard-check"></i>
            </span>
            <div class="public-tracer-banner__text">
                <p class="public-tracer-banner__title">
                    {% if public_tracer_study_count == 1 %}
                        1 public tracer study available
                    {% else %}
                        {{ public_tracer_study_count }} public tracer studies available
                    {% endif %}
                </p>
                <p class="public-tracer-banner__copy">View current and upcoming questionnaires for alumni and employers.</p>
            </div>
        </div>
        <a class="public-tracer-banner__action" href="{% url 'surveys:tracer_study_public_list' %}">
            <span>View tracer studies</span>
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </a>
    </div>
</aside>
