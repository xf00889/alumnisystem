{% load static %}
<div class="modal fade um-status-modal" id="userStatusConfirmModal" tabindex="-1"
     aria-labelledby="statusChangeTitle" aria-hidden="true"
     data-bulk-url="{% url 'core:user_bulk_action' %}">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="statusChangeTitle">Change account status</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="um-status-modal__description" id="statusChangeDescription"></p>
        <label for="statusChangeReason" class="form-label">Reason <span class="text-danger">*</span></label>
        <textarea id="statusChangeReason" class="form-control" rows="3" required maxlength="1000"
                  placeholder="Provide a clear reason for this account status change"></textarea>
        <small class="form-text">Saved to the user activity and audit history.</small>
        <p id="statusChangeError" class="um-status-modal__error" role="alert" hidden></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmUserStatusButton">Confirm change</button>
      </div>
    </div>
  </div>
</div>
