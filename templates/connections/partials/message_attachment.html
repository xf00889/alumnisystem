{% if message.attachment %}
<div class="message-attachment mt-2">
    {% if message.attachment_is_image %}
    <a href="{{ message.attachment_access_url }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ message.attachment_label }}">
        <img src="{{ message.attachment_access_url }}" alt="{{ message.attachment_label }}" class="attachment-preview" loading="lazy">
    </a>
    {% else %}
    <a href="{{ message.attachment_access_url }}" class="file-attachment" download="{{ message.attachment_label }}">
        <i class="fas fa-file me-2" aria-hidden="true"></i>{{ message.attachment_label }}
    </a>
    {% endif %}
</div>
{% endif %}
