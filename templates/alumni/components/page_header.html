{# Shared page heading for authenticated alumni; caller owns the outer shell. #}
<header class="alumni-page-hero">
    <div class="alumni-page-hero-copy">
        <h1>{% if icon %}<i class="{{ icon }}" aria-hidden="true"></i> {% endif %}{{ title }}</h1>
        {% if description %}<p>{{ description }}</p>{% endif %}
    </div>
    {% if action_url %}
    <a class="alumni-page-hero-action" href="{{ action_url }}">
        {% if action_icon %}<i class="{{ action_icon }}" aria-hidden="true"></i>{% endif %}
        {{ action_label }}
    </a>
    {% endif %}
</header>
