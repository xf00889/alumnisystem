{# Shared filters: the alumni listing uses the Directory layout; staff keep their existing filters. #}
{% if use_alumni_layout %}
<section class="search-filter-section alumni-survey-search" aria-label="Search and filter surveys">
    <div class="alumni-survey-search-form">
        <div class="alumni-survey-filter-field alumni-survey-filter-search">
            <label for="surveySearch">Search Surveys</label>
            <input type="search" class="search-input form-control" id="surveySearch" placeholder="Search title or description..." autocomplete="off">
        </div>
        <div class="alumni-survey-filter-field">
            <label for="statusFilter">Status</label>
            <select class="filter-select form-select" id="statusFilter">
                <option value="">All Surveys</option>
                <option value="available">Available</option>
                <option value="completed">Completed</option>
                <option value="expiring">Expiring Soon</option>
            </select>
        </div>
        <div class="alumni-survey-filter-field">
            <label for="sortBy">Sort By</label>
            <select class="filter-select form-select" id="sortBy">
                <option value="deadline">Sort by Deadline</option>
                <option value="title">Sort by Title</option>
                <option value="newest">Newest First</option>
            </select>
        </div>
        <div class="alumni-survey-filter-action">
            <button type="button" class="search-button" id="surveySearchButton"><i class="fas fa-search" aria-hidden="true"></i> Search</button>
        </div>
    </div>
</section>
{% else %}
<!-- Search and Filter Section -->
        <div class="search-filter-section">
            <div class="row align-items-center">
                <div class="col-md-6 mb-3 mb-md-0">
                    <div class="input-group">
                        <span class="input-group-text" style="background: var(--ui-hover); border: 1px solid var(--ui-border);">
                            <i class="fas fa-search" style="color: var(--text-muted);"></i>
                        </span>
                        <input type="text" class="search-input form-control" placeholder="Search surveys by title or description..." id="surveySearch">
                    </div>
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <select class="filter-select form-select" id="statusFilter">
                        <option value="">All Surveys</option>
                        <option value="available">Available</option>
                        <option value="completed">Completed</option>
                        <option value="expiring">Expiring Soon</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="filter-select form-select" id="sortBy">
                        <option value="deadline">Sort by Deadline</option>
                        <option value="title">Sort by Title</option>
                        <option value="newest">Newest First</option>
                    </select>
                </div>
            </div>
        </div>
{% endif %}
