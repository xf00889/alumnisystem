{% if not suppress_donation_progress %}
<ol class="dn-steps" aria-label="Donation progress">
  <li class="{% if step == 1 %}is-current{% elif step > 1 %}is-done{% endif %}"><span>1</span> Amount</li>
  <li class="{% if step == 2 %}is-current{% elif step > 2 %}is-done{% endif %}"><span>2</span> GCash transfer</li>
  <li class="{% if step == 3 %}is-current{% elif step > 3 %}is-done{% endif %}"><span>3</span> Upload proof</li>
  <li class="{% if step == 4 %}is-current{% endif %}"><span>4</span> Verification</li>
</ol>
{% endif %}
