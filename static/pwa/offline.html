<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182744">
  <title>Offline | NORSU Alumni Network</title>
  <style>
    :root {color-scheme: light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182744;background:#f7f5f0}
    * {box-sizing:border-box}
    body {min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px}
    main {width:min(100%,420px);padding:32px 24px;border:1px solid #e3dccf;border-radius:22px;background:#fff;text-align:center;box-shadow:0 12px 38px #19294415}
    img {width:86px;height:86px;object-fit:contain;margin:0 auto 18px}
    h1 {font-size:1.55rem;line-height:1.3;margin:0 0 12px}
    p {color:#52627b;line-height:1.65;margin:0 0 24px}
    a.retry {display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:inherit;font-weight:650;min-height:46px;border:0;border-radius:11px;padding:11px 26px;background:#182744;color:#fff;cursor:pointer}
    a.retry:focus-visible {outline:3px solid #cfad6e;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/static/pwa/icons/icon-192.png" alt="NORSU Alumni Network logo" width="86" height="86">
    <h1>You're offline</h1>
    <p>Reconnect to the internet to access your alumni profile, messages, jobs, and other services. For your privacy, account information is never saved for offline browsing.</p>
    <a class="retry" href="/">Try again</a>
  </main>
</body>
</html>
